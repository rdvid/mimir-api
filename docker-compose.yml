services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: mimir-api
        ports:
            - '${PORT:-5000}:5000'
        env_file:
            - .env
        environment:
            PORT: '${PORT:-5000}'
            DATABASE_URL: postgres://mimir:mimir@postgres:5432/budgetter
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

    postgres:
        image: postgres:17-alpine
        container_name: mimir-postgres
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: budgetter
            POSTGRES_USER: mimir
            POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-mimir}'
        volumes:
            - mimir-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U mimir -d budgetter']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

volumes:
    mimir-postgres-data:
