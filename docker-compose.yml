services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: mimir-api
        ports:
            - '${PORT:-5000}:5000'
        env_file:
            - .env
        environment:
            PORT: '${PORT:-5000}'
            MONGO_URL: '${MONGO_URL:-mongodb://mongo:27017/budgetter}'
        depends_on:
            mongo:
                condition: service_healthy
        restart: unless-stopped

    mongo:
        image: mongo:7
        container_name: mimir-mongo
        ports:
            - '${MONGO_PORT:-27017}:27017'
        volumes:
            - mimir-mongo-data:/data/db
        healthcheck:
            test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

volumes:
    mimir-mongo-data:
